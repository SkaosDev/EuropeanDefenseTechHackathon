# ============================================================================
#  2 — CLASSES DE DRONES : enveloppe cinématique + signatures par modalité.
#      `emission` (0..1) module la PORTÉE EFFECTIVE des capteurs (cf. §3).
#      `origin_mode`: hub = part d'un site §1.A ; forward = point avancé près du front.
# ============================================================================
drone_classes:
  shahed136:
    label: "Shahed-136"
    spawn_weight: 0.55          # majoritaire dans les vagues réelles
    speed_kmh: [165, 200]
    alt_m: [100, 2000]
    range_km: 1000
    origin_mode: hub
    emission: {optical: 0.80, acoustic: 0.90, vibration: 0.30, das: 0.30, rf: 0.20}
  gerbera:
    label: "Gerbera (leurre)"
    spawn_weight: 0.25          # leurres pour saturer la DCA
    speed_kmh: [120, 160]
    alt_m: [100, 2000]
    range_km: 500
    origin_mode: hub
    emission: {optical: 0.40, acoustic: 0.45, vibration: 0.15, das: 0.15, rf: 0.15}
  fpv_fiber:
    label: "FPV fibre optique"
    spawn_weight: 0.08          # tactique courte portée (près du front)
    speed_kmh: [90, 150]
    alt_m: [5, 120]             # rase-terre
    range_km: 20
    origin_mode: forward
    emission: {optical: 0.30, acoustic: 0.30, vibration: 0.10, das: 0.20, rf: 0.00}  # fibre = AUCUN RF
  lancet:
    label: "Lancet"
    spawn_weight: 0.12
    speed_kmh: [100, 160]
    alt_m: [50, 1000]
    range_km: 60
    origin_mode: forward
    emission: {optical: 0.40, acoustic: 0.50, vibration: 0.15, das: 0.15, rf: 0.50}  # datalink

# Oblasts de la zone de front : cibles autorisées pour les classes `forward`.
front_oblasts: [Kharkiv, Donetsk, Zaporizhzhia, Kherson, Dnipropetrovsk, Mykolaiv, Sumy, Chernihiv]

# ============================================================================
#  3 — ROUTAGE (macro O-D + micro steering)
# ============================================================================
routing:
  # Valeur-cible relative par type de zone (pondère la matrice O-D).
  zone_type_weight:
    city: 1.0
    power_tpp: 0.9
    power_hpp: 0.7
    power_npp: 0.5            # rarement frappé directement (postes alentour)
    airbase: 0.8
    port: 0.7
    defense_industry: 0.8
  prefer_boost: 2.5          # multiplicateur si l'oblast cible ∈ origin.prefers
  distance_scale_km: 350     # décroissance exp. de proba avec la distance origine->cible
  range_margin: 1.15         # cible rejetée si dist > range_km * marge
  # Micro-routing : steering behaviors
  waypoint_reach_m: 6000     # rayon de validation d'un waypoint intermédiaire
  n_midpoints: [0, 2]        # nb de waypoints latéraux aléatoires (variété de routes)
  midpoint_offset_km: 40     # écart-type latéral des waypoints intermédiaires
  seek_weight: 1.0           # poids du vecteur d'attraction vers le waypoint
  avoid_weight: 1.6          # poids de la répulsion des zones DCA
  # Zones de défense aérienne (DCA) à contourner : villes > seuil de population.
  dca:
    pop_threshold: 250000
    radius_km: 28            # rayon de répulsion autour de la ville
    influence_km: 55         # distance à laquelle la répulsion commence
  # Corridor d'attraction optionnel (axe du Dnipro) — suivi probabiliste.
  corridor_follow_prob: 0.30
  corridor_weight: 0.6
  corridor_influence_km: 50
  corridors:
    - name: "Axe Dnipro"
      polyline: [[51.50, 30.50], [50.59, 30.51], [49.77, 31.47], [49.08, 33.25], [48.47, 35.04], [47.84, 35.18], [47.52, 34.62]]

# ============================================================================
#  4 — CINÉMATIQUE (intégrateur trajectoire vérité-terrain)
# ============================================================================
kinematics:
  max_turn_rate_deg_s: 3.0   # cap de virage (rayon réaliste, pas de virage à 90° instantané)
  speed_noise_frac: 0.05     # bruit gaussien relatif sur la vitesse
  alt_noise_m: 15            # bruit gaussien sur l'altitude (suivi de terrain)
  heading_jitter_deg: 1.5    # micro-bruit de cap par pas

# ============================================================================
#  5 — CAPTEURS (grille nationale) & génération d'événements
#      `grid_km` : pas de la grille par modalité (plus petit = plus dense).
#      `base_range_km` : portée à émission=1 ; portée effective = base * emission.
# ============================================================================
sensors:
  jitter_km: 8               # bruit de position des capteurs (grille imparfaite)
  event_min_interval_s: 20   # un capteur ré-émet au plus tous les N s (borne le volume d'événements)
  detection_stride: 2        # ne teste la détection qu'un pas sur N (= résolution event_min_interval) -> ~2x plus rapide
  modalities:
    # optical gives_range=true : estimation de distance monoculaire (taille apparente, cf. tracker)
    optical:    {grid_km: 32, base_range_km: 9.0,  base_pd: 0.90, falloff: 1.4, gives_bearing: true,  gives_range: true}
    acoustic:   {grid_km: 36, base_range_km: 7.0,  base_pd: 0.85, falloff: 1.2, gives_bearing: true,  gives_range: false}
    vibration:  {grid_km: 45, base_range_km: 0.8,  base_pd: 0.80, falloff: 1.0, gives_bearing: false, gives_range: false}
    rf:         {grid_km: 55, base_range_km: 20.0, base_pd: 0.88, falloff: 1.6, gives_bearing: true,  gives_range: false}
  # Fibre DAS : capteur linéaire. Détecte près de la ligne (portée transverse faible).
  das:
    base_range_km: 1.5        # distance transverse de détection à la ligne
    base_pd: 0.75
    falloff: 1.0
    gives_bearing: false
    gives_range: false
    lines:                    # tracés fibre (réutilisent les corridors + une ligne sud)
      - [[51.50, 30.50], [50.59, 30.51], [49.08, 33.25], [48.47, 35.04], [47.84, 35.18]]
      - [[46.49, 30.73], [46.97, 31.99], [46.64, 32.62], [47.84, 35.18]]
  # Bruit d'estimation par modalité.
  bearing_noise_deg: {optical: 4, acoustic: 10, rf: 8, vibration: 60, das: 60}
  range_noise_frac: 0.35      # bruit relatif sur range_est (modalités qui le fournissent)
  confidence_noise: 0.10      # bruit additif sur la confiance
  # Faux positifs (clutter) : volume relatif au nb d'événements réels du scénario.
  # n_clutter ~ Poisson(fp_ratio * n_evenements_reels). 0.4 => ~29% des événements sont des FP.
  fp_ratio: 0.4
  # Matrices de confusion d'estimation de classe par modalité.
  # Lignes = vraie classe ; colonnes = classe estimée. Ordre : [shahed136, gerbera, fpv_fiber, lancet].
  confusion:
    optical:                  # confond fortement Shahed/Gerbera (mousse vs corps)
      shahed136: [0.70, 0.22, 0.03, 0.05]
      gerbera:   [0.35, 0.55, 0.05, 0.05]
      fpv_fiber: [0.05, 0.05, 0.80, 0.10]
      lancet:    [0.10, 0.08, 0.12, 0.70]
    acoustic:                 # sépare bien thermique (Shahed) vs électrique
      shahed136: [0.85, 0.10, 0.02, 0.03]
      gerbera:   [0.20, 0.70, 0.05, 0.05]
      fpv_fiber: [0.03, 0.05, 0.82, 0.10]
      lancet:    [0.06, 0.06, 0.18, 0.70]
    vibration:                # peu discriminant
      shahed136: [0.45, 0.30, 0.10, 0.15]
      gerbera:   [0.30, 0.40, 0.15, 0.15]
      fpv_fiber: [0.15, 0.15, 0.50, 0.20]
      lancet:    [0.20, 0.20, 0.20, 0.40]
    das:                      # peu discriminant
      shahed136: [0.45, 0.30, 0.10, 0.15]
      gerbera:   [0.30, 0.40, 0.15, 0.15]
      fpv_fiber: [0.15, 0.15, 0.50, 0.20]
      lancet:    [0.20, 0.20, 0.20, 0.40]
    rf:                       # excellent sur émetteurs (Lancet) ; ne voit JAMAIS le FPV fibre
      shahed136: [0.78, 0.12, 0.00, 0.10]
      gerbera:   [0.25, 0.65, 0.00, 0.10]
      fpv_fiber: [0.00, 0.00, 1.00, 0.00]   # non pertinent (émission RF nulle -> aucun événement)
      lancet:    [0.08, 0.07, 0.00, 0.85]

# ============================================================================
#  6 — PRÉPARATION DES SÉQUENCES (sequence_prep.py) pour le LSTM multi-têtes
# ============================================================================
sequence:
  max_len: 64                 # longueur max de la séquence d'événements (padding/troncature)
  observation_fractions: [0.25, 0.5, 0.75, 1.0]  # cutoffs d'observation -> data augmentation "alerte précoce"
  n_future: 12                # nb de points de trajectoire future à prédire (tête trajectoire)
  val_fraction: 0.2           # split train/val PAR DRONE (anti-fuite)
  dt_norm_s: 600              # échelle de normalisation du temps (Δt / dt_norm)
