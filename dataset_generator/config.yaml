# ============================================================================
#  Simulateur de dataset counter-UAS — configuration centrale.
#  Toutes les constantes ajustables sont ici (aucun magic number dans le code).
#
#  Coordonnées : WGS-84 degrés décimaux. Sources : OSINT public (ISW, Defense
#  Express, militarnyi, Wikipedia/Wikidata/OSM). Usage DÉFENSIF uniquement.
# ============================================================================

# --- Paramètres de simulation (surchargés par la CLI : main.py --help) -------
sim:
  seed: 42                 # graine RNG -> reproductibilité
  n_drones: 2000           # nombre de trajectoires à générer
  dt_s: 10                 # pas de temps de l'intégrateur cinématique (secondes)
  max_steps: 2400          # garde-fou : ~6h40 à dt=10s (~1200 km) -> couvre la portée Shahed
  reach_radius_m: 1500     # cible considérée atteinte sous ce rayon

# --- Emprise géographique (Ukraine + marge) ---------------------------------
ukraine_bbox:              # sert au placement des capteurs et à la normalisation
  lat_min: 44.0
  lat_max: 53.0
  lon_min: 22.0
  lon_max: 40.5

# ============================================================================
#  1.A — SITES DE LANCEMENT (origines longue portée). `prefers` = oblasts visés
#        (OSINT directionnel) ; `weight` = fréquence relative de lancement.
