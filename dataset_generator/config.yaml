# ============================================================================
#  Simulateur de dataset counter-UAS — configuration centrale (v2, réaliste).
#  Coordonnées : WGS-84 degrés décimaux. Sources : OSINT public (ISW, ACLED,
#  Defense Express, militarnyi, air-alarms.in.ua, OHCHR). Usage DÉFENSIF uniquement.
#
#  v2 : 28 cibles curées + priors de ciblage basés sur données réelles (priority +
#  affinité classe×zone), capteurs réalistes (acoustique/optique/RF/DAS/observateur,
#  PAS de vibration), placement clippé au territoire ukrainien.
# ============================================================================

sim:
  seed: 42
  n_drones: 2000
  dt_s: 10
  max_steps: 2400
  reach_radius_m: 1500

ukraine_bbox:
  lat_min: 44.0
  lat_max: 53.0
  lon_min: 22.0
  lon_max: 40.5

# Frontière ukrainienne (polygone) pour clipper les capteurs au territoire.
ua_border_file: ua_border.json

# ============================================================================
#  1.A — SITES DE LANCEMENT (origines longue portée).
# ============================================================================
origins:
  - {name: "Tsymbulova",          region: "Oryol (RU)",     lat: 53.3647, lon: 35.8222, weight: 1.4, prefers: [Kyiv, Sumy, Kharkiv, Chernihiv, Poltava]}
  - {name: "Primorsko-Akhtarsk",  region: "Krasnodar (RU)", lat: 45.6833, lon: 38.7167, weight: 1.6, prefers: [Odesa, Mykolaiv, Kherson, Zaporizhzhia, Dnipropetrovsk]}
  - {name: "Cap Chauda",          region: "Crimee (occ.)",  lat: 45.0046, lon: 35.8301, weight: 1.3, prefers: [Dnipropetrovsk, Mykolaiv, Kherson, Odesa, Zaporizhzhia]}
  - {name: "Navlya",              region: "Bryansk (RU)",   lat: 52.8281, lon: 34.4989, weight: 1.0, prefers: [Chernihiv, Sumy, Kyiv]}
  - {name: "Seshcha",             region: "Bryansk (RU)",   lat: 53.7150, lon: 33.3389, weight: 1.0, prefers: [Kyiv, Chernihiv, Sumy, Zhytomyr]}
  - {name: "Asovitsa",            region: "Bryansk (RU)",   lat: 52.3228, lon: 34.5061, weight: 0.8, prefers: [Chernihiv, Sumy]}
  - {name: "Oryol (ville)",       region: "Oryol (RU)",     lat: 53.3715, lon: 35.8029, weight: 1.0, prefers: [Kyiv, Sumy, Chernihiv]}
  - {name: "Shatalovo",           region: "Smolensk (RU)",  lat: 54.3400, lon: 32.4733, weight: 0.9, prefers: [Kyiv, Chernihiv, Zhytomyr, Rivne]}
  - {name: "Yeysk",               region: "Krasnodar (RU)", lat: 46.6835, lon: 38.2145, weight: 1.1, prefers: [Odesa, Mykolaiv, Kherson, Zaporizhzhia]}
  - {name: "Millerovo",           region: "Rostov (RU)",    lat: 48.9522, lon: 40.3022, weight: 0.9, prefers: [Zaporizhzhia, Dnipropetrovsk, Donetsk]}
  - {name: "Korenovsk",           region: "Krasnodar (RU)", lat: 45.4461, lon: 39.4217, weight: 1.0, prefers: [Odesa, Kherson, Zaporizhzhia, Mykolaiv]}
  - {name: "Shakhty",             region: "Rostov (RU)",    lat: 47.7085, lon: 40.2154, weight: 0.7, prefers: [Zaporizhzhia, Dnipropetrovsk, Donetsk]}

# ============================================================================
#  1.B — CIBLES (28 sites curés). `priority` = intensité de ciblage RÉELLE par
#        oblast (+ ajustement site), source en commentaire. dest_id = ordre.
#        Bases : ACLED 2024 (Kharkiv > ... > Sumy), air-alarms.in.ua (Kharkiv #1,
#        Sumy #2 ~1560), comptages Kharkiv 728/an & Kherson ~8000/an, OHCHR.
# ============================================================================
targets:
  # --- Villes principales (12) ---
  - {name: "Kyiv",        oblast: Kyiv,           zone_type: city, lat: 50.4501, lon: 30.5234, pop: 3109000, priority: 2.2}  # capitale, cible profonde n°1
  - {name: "Kharkiv",     oblast: Kharkiv,        zone_type: city, lat: 50.0028, lon: 36.2304, pop: 1444000, priority: 3.0}  # oblast le + frappé (ACLED/alertes)
  - {name: "Odesa",       oblast: Odesa,          zone_type: city, lat: 46.4858, lon: 30.7326, pop: 1010000, priority: 1.6}  # campagne Mer Noire
  - {name: "Dnipro",      oblast: Dnipropetrovsk, zone_type: city, lat: 48.4684, lon: 35.0425, pop: 933000,  priority: 2.0}  # front, ACLED haut
  - {name: "Zaporijjia",  oblast: Zaporizhzhia,   zone_type: city, lat: 47.8388, lon: 35.1846, pop: 721000,  priority: 2.2}  # front
  - {name: "Lviv",        oblast: Lviv,           zone_type: city, lat: 49.8397, lon: 24.0297, pop: 717000,  priority: 0.8}  # ouest, frappes périodiques
  - {name: "Kryvyi Rih",  oblast: Dnipropetrovsk, zone_type: city, lat: 47.9095, lon: 33.3804, pop: 600000,  priority: 1.5}
  - {name: "Mykolaiv",    oblast: Mykolaiv,       zone_type: city, lat: 46.9748, lon: 31.9948, pop: 476000,  priority: 1.4}
  - {name: "Vinnytsia",   oblast: Vinnytsia,      zone_type: city, lat: 49.2328, lon: 28.4682, pop: 371000,  priority: 0.9}
  - {name: "Poltava",     oblast: Poltava,        zone_type: city, lat: 49.5883, lon: 34.5514, pop: 318000,  priority: 1.2}
  - {name: "Sumy",        oblast: Sumy,           zone_type: city, lat: 50.9216, lon: 34.8003, pop: 286000,  priority: 2.0}  # alertes #2 (1560/2024)
  - {name: "Kherson",     oblast: Kherson,        zone_type: city, lat: 46.6350, lon: 32.6167, pop: 283000,  priority: 2.6}  # ~8000 attaques/2024

  # --- Centrales nucléaires (4) : rarement frappées directement -> priorité basse ---
  - {name: "Zaporizhzhia NPP",  oblast: Zaporizhzhia, zone_type: power_npp, lat: 47.5167, lon: 34.6167, priority: 0.3}  # occupée
  - {name: "South Ukraine NPP", oblast: Mykolaiv,     zone_type: power_npp, lat: 47.8167, lon: 31.2167, priority: 0.6}
  - {name: "Rivne NPP",         oblast: Rivne,        zone_type: power_npp, lat: 51.3278, lon: 25.8917, priority: 0.5}
  - {name: "Khmelnytskyi NPP",  oblast: Khmelnytskyi, zone_type: power_npp, lat: 50.3014, lon: 26.6497, priority: 0.5}

  # --- Bases aériennes (5) : cibles privilégiées des Lancet/missiles ---
  - {name: "Starokostiantyniv AB", oblast: Khmelnytskyi, zone_type: airbase, lat: 49.8500, lon: 26.5670, priority: 1.6}  # base F-16, très visée
  - {name: "Myrhorod AB",       oblast: Poltava,         zone_type: airbase, lat: 49.9317, lon: 33.6394, priority: 1.3}
  - {name: "Vasylkiv AB",       oblast: Kyiv,            zone_type: airbase, lat: 50.2333, lon: 30.3000, priority: 1.2}
  - {name: "Ozerne AB",         oblast: Zhytomyr,        zone_type: airbase, lat: 50.1583, lon: 28.7383, priority: 1.0}
  - {name: "Kulbakino AB",      oblast: Mykolaiv,        zone_type: airbase, lat: 46.9419, lon: 32.0972, priority: 1.2}

  # --- Ports (3) : campagne Mer Noire / Danube ---
  - {name: "Pivdennyi port",    oblast: Odesa, zone_type: port, lat: 46.6300, lon: 31.0150, priority: 1.4}
  - {name: "Chornomorsk port",  oblast: Odesa, zone_type: port, lat: 46.3019, lon: 30.6564, priority: 1.3}
  - {name: "Izmail port",       oblast: Odesa, zone_type: port, lat: 45.3461, lon: 28.8369, priority: 1.3}  # Danube, très frappé

  # --- Industrie de défense (4) ---
  - {name: "Pivdenmash",        oblast: Dnipropetrovsk, zone_type: defense_industry, lat: 48.4630, lon: 35.0850, priority: 1.6}  # frappe ICBM nov.2024
  - {name: "Motor Sich",        oblast: Zaporizhzhia,   zone_type: defense_industry, lat: 47.8422, lon: 35.2092, priority: 1.4}
  - {name: "Antonov/Hostomel",  oblast: Kyiv,           zone_type: defense_industry, lat: 50.6038, lon: 30.1919, priority: 1.2}
  - {name: "Artem",             oblast: Kyiv,           zone_type: defense_industry, lat: 50.4869, lon: 30.4456, priority: 1.1}

objective_by_zone_type:
  city: population
  power_npp: energy
  airbase: military
  port: logistics
  defense_industry: industry

# ============================================================================
#  2 — CLASSES DE DRONES. `emission` (0..1) module la portée effective des
#      capteurs. observer = détectabilité par l'humain (vue/ouïe).
# ============================================================================
drone_classes:
  shahed136:
    label: "Shahed-136"
    spawn_weight: 0.55
    speed_kmh: [165, 200]
    alt_m: [100, 2000]
    range_km: 1000
    origin_mode: hub
    emission: {acoustic: 0.90, optical: 0.80, rf: 0.20, das: 0.30, observer: 0.75}  # lent/bruyant/visible
  gerbera:
    label: "Gerbera (leurre)"
    spawn_weight: 0.25
    speed_kmh: [120, 160]
    alt_m: [100, 2000]
    range_km: 500
    origin_mode: hub
    emission: {acoustic: 0.45, optical: 0.40, rf: 0.15, das: 0.15, observer: 0.50}
  fpv_fiber:
    label: "FPV fibre optique"
    spawn_weight: 0.08
    speed_kmh: [90, 150]
    alt_m: [5, 120]
    range_km: 20
    origin_mode: forward
    emission: {acoustic: 0.30, optical: 0.30, rf: 0.00, das: 0.20, observer: 0.20}  # fibre = AUCUN RF
  lancet:
    label: "Lancet"
    spawn_weight: 0.12
    speed_kmh: [100, 160]
    alt_m: [50, 1000]
    range_km: 60
    origin_mode: forward
    emission: {acoustic: 0.50, optical: 0.40, rf: 0.50, das: 0.15, observer: 0.35}  # datalink

front_oblasts: [Kharkiv, Donetsk, Zaporizhzhia, Kherson, Dnipropetrovsk, Mykolaiv, Sumy, Chernihiv]

# ============================================================================
#  3 — ROUTAGE. Poids O-D = priority(cible) × affinité(classe, type) × décroissance
#      de distance (mode hub) ; la branche forward reste limitée aux oblasts de front.
# ============================================================================
routing:
  # Affinité classe × type de zone (données réelles : Shahed→villes/ports/industrie ;
  # Lancet→aviation/militaire ; FPV→front). Source : CSIS/ISIS/Defense Express.
  class_zone_affinity:
    shahed136: {city: 1.0, port: 0.9, defense_industry: 0.8, power_npp: 0.6, airbase: 0.5}
    gerbera:   {city: 1.0, port: 0.9, defense_industry: 0.7, power_npp: 0.5, airbase: 0.5}
    lancet:    {city: 0.5, port: 0.4, defense_industry: 0.8, power_npp: 0.3, airbase: 1.0}
    fpv_fiber: {city: 0.7, port: 0.3, defense_industry: 0.5, power_npp: 0.2, airbase: 0.6}
  prefer_boost: 2.0          # multiplicateur si l'oblast cible ∈ origin.prefers
  distance_scale_km: 350     # décroissance exp. de proba avec la distance origine->cible
  range_margin: 1.15
  waypoint_reach_m: 6000
  n_midpoints: [0, 2]
  midpoint_offset_km: 40
  seek_weight: 1.0
  avoid_weight: 1.6
  dca:
    pop_threshold: 250000
    radius_km: 28
    influence_km: 55
  corridor_follow_prob: 0.30
  corridor_weight: 0.6
  corridor_influence_km: 50
  corridors:
    - name: "Axe Dnipro"
      polyline: [[51.50, 30.50], [50.59, 30.51], [49.77, 31.47], [49.08, 33.25], [48.47, 35.04], [47.84, 35.18], [47.52, 34.62]]

# ============================================================================
#  4 — CINÉMATIQUE
# ============================================================================
kinematics:
  max_turn_rate_deg_s: 3.0
  speed_noise_frac: 0.05
  alt_noise_m: 15
  heading_jitter_deg: 1.5

# ============================================================================
#  5 — CAPTEURS (réalistes, clippés au territoire UA) & génération d'événements.
#      4 modalités ponctuelles + DAS linéaire. PAS de vibration.
#      `placement` : grid (grille clippée UA) | around_value (autour des sites à
#      haute valeur + villes) | around_cities (zones peuplées, ∝ population).
# ============================================================================
sensors:
  jitter_km: 6
  event_min_interval_s: 20
  detection_stride: 2
  modalities:
    # Acoustique : Sky Fortress + Zvook (réseaux denses, ~24 000 capteurs réels). Chaque
    # nœud sim ≈ un cluster local. Couvre tout le territoire peuplé -> accroche les drones
    # (FPV fibre incluse). Source : united24media, army.mil, militarnyi.
    acoustic:  {placement: grid, grid_km: 20, base_range_km: 9.0, base_pd: 0.90, falloff: 1.2, gives_bearing: true,  gives_range: false}
    # Optique/IR : caméras + IA sur sites + large rayon + villes. Source : defence-blog.
    optical:   {placement: around_value, radius_km: 45, per_site: 6, base_range_km: 9.0, base_pd: 0.90, falloff: 1.4, gives_bearing: true, gives_range: true}
    # RF/EW : longue portée, frontière/front/villes ; AVEUGLE aux FPV fibre. Source : TWZ.
    rf:        {placement: grid, grid_km: 45, base_range_km: 22.0, base_pd: 0.88, falloff: 1.6, gives_bearing: true, gives_range: false}
    # Observateur : ePPO + groupes feu mobiles (zones peuplées). Relèvement seul. Source : Lieber/ePPO.
    observer:  {placement: around_cities, radius_km: 28, per_100k_pop: 0.6, min_per_city: 2, base_range_km: 7.0, base_pd: 0.80, falloff: 1.0, gives_bearing: true, gives_range: false}
  # Fibre DAS : réseau dense reliant la plupart des villes (+ antennes), dans le territoire.
  das:
    base_range_km: 1.5
    base_pd: 0.75
    falloff: 1.0
    gives_bearing: false
    gives_range: false
    lines:
      - [[49.8397, 24.0297], [49.5535, 25.5948], [49.4144, 26.9910], [49.2328, 28.4682], [50.2547, 28.6587], [50.4501, 30.5234]]  # ouest -> Kyiv
      - [[50.4501, 30.5234], [49.5883, 34.5514], [50.0028, 36.2304]]                                                              # Kyiv-Poltava-Kharkiv
      - [[50.4501, 30.5234], [49.4270, 32.0624], [49.0605, 33.4161], [48.4684, 35.0425], [47.8388, 35.1846]]                      # axe Dnipro
      - [[48.4684, 35.0425], [47.9095, 33.3804], [46.9748, 31.9948], [46.4858, 30.7326]]                                          # Dnipro-sud
      - [[46.4858, 30.7326], [46.9748, 31.9948], [46.6350, 32.6167]]                                                              # côte sud
      - [[50.4501, 30.5234], [50.9216, 34.8003]]                                                                                  # Kyiv-Sumy
      - [[50.9216, 34.8003], [50.0028, 36.2304]]                                                                                  # Sumy-Kharkiv (front)
      - [[50.0028, 36.2304], [48.4684, 35.0425]]                                                                                  # Kharkiv-Dnipro
  bearing_noise_deg: {optical: 4, acoustic: 10, rf: 8, observer: 15, das: 60}
  range_noise_frac: 0.35
  confidence_noise: 0.10
  fp_ratio: 0.4
  # Matrices de confusion (lignes = vraie classe ; colonnes = [shahed136, gerbera, fpv_fiber, lancet]).
  confusion:
    optical:
      shahed136: [0.70, 0.22, 0.03, 0.05]
      gerbera:   [0.35, 0.55, 0.05, 0.05]
      fpv_fiber: [0.05, 0.05, 0.80, 0.10]
      lancet:    [0.10, 0.08, 0.12, 0.70]
    acoustic:
      shahed136: [0.85, 0.10, 0.02, 0.03]
      gerbera:   [0.20, 0.70, 0.05, 0.05]
      fpv_fiber: [0.03, 0.05, 0.82, 0.10]
      lancet:    [0.06, 0.06, 0.18, 0.70]
    rf:
      shahed136: [0.78, 0.12, 0.00, 0.10]
      gerbera:   [0.25, 0.65, 0.00, 0.10]
      fpv_fiber: [0.00, 0.00, 1.00, 0.00]
      lancet:    [0.08, 0.07, 0.00, 0.85]
    das:
      shahed136: [0.45, 0.30, 0.10, 0.15]
      gerbera:   [0.30, 0.40, 0.15, 0.15]
      fpv_fiber: [0.15, 0.15, 0.50, 0.20]
      lancet:    [0.20, 0.20, 0.20, 0.40]
    observer:                 # humain : identification de classe peu précise (diffuse)
      shahed136: [0.55, 0.25, 0.05, 0.15]
      gerbera:   [0.40, 0.40, 0.05, 0.15]
      fpv_fiber: [0.10, 0.10, 0.55, 0.25]
      lancet:    [0.20, 0.15, 0.15, 0.50]

# ============================================================================
#  6 — PRÉPARATION DES SÉQUENCES (LSTM multi-têtes)
# ============================================================================
sequence:
  max_len: 64
  observation_fractions: [0.25, 0.5, 0.75, 1.0]
  n_future: 12
  val_fraction: 0.2
  dt_norm_s: 600
