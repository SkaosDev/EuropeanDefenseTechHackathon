# ============================================================================
#  Configuration centrale du système de tracking embarqué.
#  Tous les paramètres ajustables sont ici — aucun "magic number" dans le code.
# ============================================================================

camera:
  type: c3                    # picamera | webcam | c3   (C3 18X = caméra UVC + focus motorisé SCF4)
  use_picamera: false         # rétro-compat si 'type' absent : true = PiCam, false = webcam
  source: 1                   # index OpenCV de la C3 18X (UVC) ; LE VÉRIFIER : `v4l2-ctl --list-devices`
                              #   (souvent 1 et non 0 : /dev/video0 est un sous-périphérique libcamera)
  resolution: [1280, 720]     # [largeur, hauteur] ; la C3 18X préfère 720p
  fps: 30
  format: "RGB888"            # format picamera2 (renvoie un buffer compatible BGR)

  # Zoom motorisé (axe A) — utilisé UNIQUEMENT si type == c3.
  zoom:
    dezoom_on_start: true     # au lancement (avant l'autofocus) : pousse le zoom jusqu'à la butée grand-angle
    axis: A                   # axe zoom du SCF4
    wide_position: 0          # côté grand-angle = sens du dézoom + origine après butée (indépendant du homing) ;
                              # si le zoom part quand même au téléobjectif, mettre 64000
    min: 0                    # bornes de la course zoom (boutons manuels du dashboard)
    max: 64000
    manual_step: 2000         # pas des boutons − dézoom / + zoom

  # Focus motorisé — utilisé UNIQUEMENT si type == c3 (lentille SCF4 sur port série).
  # Si le contrôleur SCF4 est absent, la vidéo continue et le focus est désactivé.
  focus:
    port: auto                # port série SCF4 ("auto" = autodétection)
    home_on_start: true       # homing de l'axe focus au démarrage
    autofocus_on_start: true  # mise au point one-shot au démarrage (pas de refocus ensuite)
    focus_min: 2000           # plage réelle mesurée sur ce montage (pic étroit ~7700)
    focus_max: 15000
    coarse_step: 300          # pas de la passe grossière (< largeur du pic)
    fine_step: 30             # pas de la passe fine
    fine_window: 400          # demi-fenêtre fine autour du pic grossier
    speed: 600                # vitesse moteur (M240 ; valeur haute = lent)
    backlash_steps: 20        # compensation du jeu mécanique
    approach_dir: 1           # sens d'arrivée sur la position finale (+1 = par le bas)
    early_stop_ratio: 0.30    # arrêt anticipé de la passe grossière (pic dépassé)
    roi_ratio: 0.40           # ROI centrale de mesure de netteté (40 % de l'image)
    manual_step: 50           # pas des boutons +/- du dashboard
    settle_sec: 0.15          # fenêtre de mesure de netteté après l'arrêt moteur

detection:
  # Choix du modèle (surchargeable : python main.py --model drone|base) :
  #   "drone" : YOLO11n custom (drone/bird/airplane), entraîné sur ~30k images — léger ET précis.
  #             Entraînement : training/train_drone.py (GPU). Sur Pi, exporté en NCNN par setup.sh.
  #   "base"  : YOLOv8n COCO, 80 classes générales — rapide, SANS classe drone.
  model: "drone"
  device: "cpu"
  iou_threshold: 0.5

  models:
    drone:                          # YOLO11n fine-tuné drone_bird_uav_aircraft (Roboflow, CC BY 4.0)
      path: "models/drone_yolo11n.pt"   # si un dossier frère *_ncnn_model existe, il est chargé en priorité (Pi)
      classes: []                   # toutes (drone, bird, airplane) — bird/airplane = anti-faux-positifs
      priority_class: "drone"
      confidence: 0.30
      inference_size: 640           # 640 mini — downscaler tue les petits drones (MDPI 2023)
    base:                           # YOLOv8n COCO : rapide, généraliste (PAS de drones)
      path: "models/yolov8n.pt"
      classes: ["person"]           # mode base = on ne détecte (et ne suit) QUE les humains
      priority_class: "person"
      confidence: 0.40
      inference_size: 416           # personnes = grandes cibles : 416 suffit et ~double le FPS vs 640.
                                    # IMPORTANT : exporter le NCNN à CETTE taille (imgsz=416), cf. README.

tracking:
  max_lost_frames: 30         # frames avant d'oublier un objet disparu
  min_hits: 3                 # détections avant d'afficher un track (anti-faux positifs)

# Orientation caméra : la caméra suit la cible verrouillée (1re cible observée ; quand on la
# perd, la plus ancienne encore visible). Classe suivie = priority_class du modèle.
pantilt:
  driver: servo               # servo (Raspberry Pi GPIO) | sim (dev : pas de moteur, déplacement simulé)
  servo_min_deg: 0            # butées physiques du servo (SG90 : 0–180°)
  servo_max_deg: 180
  home_pan_deg: 90            # position de repos au démarrage (degrés servo) — caméra centrée
  home_tilt_deg: 90
  gain: 0.5                   # gain proportionnel de l'asservissement (0–1 ; <1 = lissé, anti-oscillation)
  deadband_deg: 1.5           # zone morte : sous cette erreur angulaire, on ne bouge pas (anti-jitter)
  max_step_deg: 8             # pas max par frame (degrés servo) — limite la vitesse, mouvement fluide
  invert_pan: false           # sens du servo pan si câblé à l'envers
  invert_tilt: false
  # gear_ratio PROPRE À CHAQUE MOTEUR : angle_caméra = gear_ratio * angle_servo (réduction mécanique).
  # Pour tourner la caméra de Δ°, le servo tourne de Δ/gear_ratio°.
  pan:                        # servo gauche/droite
    pin: 23                   # GPIO BCM
    gear_ratio: 1.0
    min_pulse_ms: 0.5         # largeur d'impulsion à servo_min_deg (SG90 ~0.5 ms)
    max_pulse_ms: 2.5         # largeur d'impulsion à servo_max_deg (SG90 ~2.5 ms)
  tilt:                       # servo haut/bas
    pin: 24                   # GPIO BCM
    gear_ratio: 1.0
    min_pulse_ms: 0.5
    max_pulse_ms: 2.5

distance:
  # Estimation monoculaire basée sur la LARGEUR de la bbox (plus stable que la hauteur :
  # se pencher n'éloigne plus l'objet). Lissée dans le temps par track (EMA).
  enable: true
  hfov_deg: 66                # champ de vision horizontal (PiCam v3 ~66°, webcam ~60°)
  smoothing: 0.3              # poids EMA : 0 = figé, 1 = brut (réactif mais bruité)
  default_width_m: 0.5        # largeur réelle supposée si la classe est inconnue
  known_widths_m:             # largeur réelle typique par classe (mètres)
    drone: 0.4                # quadricoptère / classe aliasée
    person: 0.5              # largeur d'épaules
    bird: 0.3
    airplane: 10.0

output:
  display: false              # fenêtre OpenCV imshow (nécessite un écran + opencv non-headless)
  mjpeg_stream: true          # serveur MJPEG (priorité démo, fonctionne en headless)
  mjpeg_host: "0.0.0.0"
  mjpeg_port: 5000
  log_path: "logs/detections.json"
  log_rotation_mb: 10
  draw_trajectory: true
  trajectory_length: 50
