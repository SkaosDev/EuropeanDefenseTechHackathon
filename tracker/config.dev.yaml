# ============================================================================
#  Configuration DEV — Windows / macOS (webcam USB, PAS de PiCam).
#  Utilisation :  python main.py --config config.dev.yaml --headless
#  Flux vidéo   :  http://localhost:5000/
# ============================================================================

camera:
  type: c3                # picamera | webcam | c3   (mettre "c3" si la Kurokesu C3 18X est branchée)
  use_picamera: false         # rétro-compat si 'type' absent : PC de dev = webcam OpenCV
  source: 0                   # index de la webcam / C3 18X (0 = par défaut ; essayer 1 si besoin)
  resolution: [640, 480]      # pour la C3, plutôt [1280, 720]
  fps: 30
  format: "RGB888"            # ignoré en mode webcam

  capture_watchdog_sec: 3     # (c3) reconnexion auto si plus aucune frame pendant ce délai
  read_fail_limit: 60         # (c3) nb d'échecs de lecture consécutifs avant reconnexion

  # Zoom + focus motorisés de la C3 18X (utilisés uniquement si type == c3).
  zoom:
    dezoom_on_start: true     # au lancement (avant l'autofocus) : pousse le zoom jusqu'à la butée grand-angle
    axis: A
    wide_position: 0          # côté grand-angle = sens du dézoom + origine après butée ; si ça part au télé, mettre 64000
    min: 0                    # bornes de la course zoom (boutons manuels du dashboard)
    max: 64000
    manual_step: 2000         # pas des boutons − dézoom / + zoom
  focus:
    port: auto
    home_on_start: true
    autofocus_on_start: true
    focus_min: 2000
    focus_max: 15000
    coarse_step: 300
    fine_step: 30
    fine_window: 400
    speed: 600
    backlash_steps: 20
    approach_dir: 1
    early_stop_ratio: 0.30
    roi_ratio: 0.40
    manual_step: 50
    settle_sec: 0.4           # fenêtre de mesure après l'arrêt moteur (l'AF est rare -> on prend le temps)
    position_tolerance: 30    # écart max toléré consigne/position lue (pas) ; sinon réessai
    position_retries: 2       # nb de réessais si la position lue s'écarte trop
    fresh_frames: 3           # nb de frames neuves à attendre après l'arrêt avant de mesurer
    live_sharpness_interval: 0.2  # période (s) de calcul de la netteté affichée en direct

detection:
  # drone (YOLO11n custom : drone/bird/airplane) | base (COCO, rapide, sans drone)
  # Override : python main.py --config config.dev.yaml --model base
  model: "drone"
  device: "cpu"
  iou_threshold: 0.5

  models:
    drone:
      path: "models/drone_yolo11n.pt"   # produit par training/train_drone.py (GPU)
      classes: []                 # drone, bird, airplane — bird/airplane = anti-faux-positifs
      priority_class: "drone"
      confidence: 0.30
      inference_size: 640         # ne pas baisser sous 640 (petits drones)
    base:
      path: "models/yolov8n.pt"
      classes: ["person"]         # mode base = on ne détecte (et ne suit) QUE les humains
      priority_class: "person"
      confidence: 0.40
      inference_size: 640

tracking:
  max_lost_frames: 30
  min_hits: 3

# Orientation caméra (suivi de cible). En dev : driver "sim" -> aucun servo, on simule le
# déplacement et le cône caméra pivote dans la vue 3D du dashboard.
pantilt:
  driver: sim                 # dev : pas de GPIO. Mettre "servo" sur le Raspberry Pi (cf. config.yaml).
  servo_min_deg: 0
  servo_max_deg: 180
  home_pan_deg: 90            # position de repos au démarrage (caméra centrée)
  home_tilt_deg: 90
  gain: 0.5                   # gain proportionnel (anti-oscillation)
  deadband_deg: 1.5           # zone morte (anti-jitter)
  max_step_deg: 8             # pas max par frame (limite de vitesse)
  invert_pan: false
  invert_tilt: false
  # gear_ratio propre à chaque moteur : angle_caméra = gear_ratio * angle_servo.
  pan:  { pin: 12, gear_ratio: 1.0, min_pulse_ms: 0.5, max_pulse_ms: 2.5 }   # GPIO BCM (ignoré en sim)
  tilt: { pin: 13, gear_ratio: 1.0, min_pulse_ms: 0.5, max_pulse_ms: 2.5 }

distance:
  # Basée sur la LARGEUR de bbox (stable quand on se penche) + lissage EMA par track.
  enable: true
  hfov_deg: 60                # webcam typique ~60° (ajuster si distances biaisées)
  smoothing: 0.3
  default_width_m: 0.5
  known_widths_m:
    drone: 0.4
    person: 0.5
    bird: 0.3
    airplane: 10.0

output:
  display: false              # true = fenêtre OpenCV locale (nécessite opencv-contrib-python)
  mjpeg_stream: true          # priorité : flux navigateur, marche partout
  mjpeg_host: "127.0.0.1"     # dev local uniquement (mettre 0.0.0.0 pour exposer sur le réseau)
  mjpeg_port: 5173
  jpeg_quality: 70            # qualité JPEG du flux (50–85) ; baisser = moins de CPU + bande passante
  stream_max_width: 0         # largeur max du flux (0 = pleine résolution) ; n'affecte PAS la détection
  log_path: "logs/detections.json"
  log_rotation_mb: 10
  draw_trajectory: true
  trajectory_length: 50
