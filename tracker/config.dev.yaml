# ============================================================================
#  Configuration DEV — Windows / macOS (webcam USB, PAS de PiCam).
#  Utilisation :  python main.py --config config.dev.yaml --headless
#  Flux vidéo   :  http://localhost:5000/
# ============================================================================

camera:
  type: c3                # picamera | webcam | c3   (mettre "c3" si la Kurokesu C3 18X est branchée)
  use_picamera: false         # rétro-compat si 'type' absent : PC de dev = webcam OpenCV
  source: 0                   # index de la webcam / C3 18X (0 = par défaut ; essayer 1 si besoin)
  resolution: [640, 480]      # pour la C3, plutôt [1280, 720]
  fps: 30
  format: "RGB888"            # ignoré en mode webcam

  # Zoom + focus motorisés de la C3 18X (utilisés uniquement si type == c3).
  zoom:
    dezoom_on_start: true     # au lancement (avant l'autofocus) : pousse le zoom jusqu'à la butée grand-angle
    axis: A
    wide_position: 0          # côté grand-angle = sens du dézoom + origine après butée ; si ça part au télé, mettre 64000
    min: 0                    # bornes de la course zoom (boutons manuels du dashboard)
    max: 64000
    manual_step: 2000         # pas des boutons − dézoom / + zoom
  focus:
    port: auto
    home_on_start: true
    autofocus_on_start: true
    focus_min: 2000
    focus_max: 15000
    coarse_step: 300
    fine_step: 30
    fine_window: 400
    speed: 600
    backlash_steps: 20
    approach_dir: 1
    early_stop_ratio: 0.30
    roi_ratio: 0.40
    manual_step: 50
    settle_sec: 0.15

detection:
  # drone (YOLO11n custom : drone/bird/airplane) | base (COCO, rapide, sans drone)
  # Override : python main.py --config config.dev.yaml --model base
  model: "drone"
  device: "cpu"
  iou_threshold: 0.5

  models:
    drone:
      path: "models/drone_yolo11n.pt"   # produit par training/train_drone.py (GPU)
      classes: []                 # drone, bird, airplane — bird/airplane = anti-faux-positifs
      priority_class: "drone"
      confidence: 0.30
      inference_size: 640         # ne pas baisser sous 640 (petits drones)
    base:
      path: "models/yolov8n.pt"
      classes: []
      priority_class: "person"
      confidence: 0.40
      inference_size: 640

tracking:
  max_lost_frames: 30
  min_hits: 3

distance:
  # Basée sur la LARGEUR de bbox (stable quand on se penche) + lissage EMA par track.
  enable: true
  hfov_deg: 60                # webcam typique ~60° (ajuster si distances biaisées)
  smoothing: 0.3
  default_width_m: 0.5
  known_widths_m:
    drone: 0.4
    person: 0.5
    bird: 0.3
    airplane: 10.0

output:
  display: false              # true = fenêtre OpenCV locale (nécessite opencv-contrib-python)
  mjpeg_stream: true          # priorité : flux navigateur, marche partout
  mjpeg_host: "127.0.0.1"     # dev local uniquement (mettre 0.0.0.0 pour exposer sur le réseau)
  mjpeg_port: 5173
  log_path: "logs/detections.json"
  log_rotation_mb: 10
  draw_trajectory: true
  trajectory_length: 50
